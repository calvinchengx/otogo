name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # The tool must be able to scaffold and open a round on a clean checkout.
      - name: smoke
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          otogo init .
          otogo status
