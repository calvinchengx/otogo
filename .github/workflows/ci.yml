name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # Coverage is a floor, not a target: it fails when a change drops it,
      # so an untested command cannot land quietly.
      - name: coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --summary-only --fail-under-lines 85
      # The binary must scaffold and report on a clean checkout.
      - name: smoke
        run: |
          cargo build --release
          mkdir -p "${RUNNER_TEMP}/smoke" && cd "${RUNNER_TEMP}/smoke"
          "${GITHUB_WORKSPACE}/target/release/otogo" init .
          "${GITHUB_WORKSPACE}/target/release/otogo" status
