[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otogo"
dynamic = ["version"]
description = "Goal loops where the agent owns the turns and a person owns the rounds"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Calvin Cheng", email = "calvin@calvinx.com" }]
keywords = ["agents", "evaluation", "harness", "goal-loop", "witnesses"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
otogo = "otogo.cli:main"

[project.urls]
Homepage = "https://github.com/calvinchengx/otogo"
Issues = "https://github.com/calvinchengx/otogo/issues"

[tool.hatch.version]
path = "src/otogo/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
